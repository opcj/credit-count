project_id = "credit-count"

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback", "http://127.0.0.1:3001/auth/callback"]
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 10

[auth.email]
# Keep the email/password provider enabled; the global signup setting blocks registration.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100
token_verifications = 100

[analytics]
enabled = false

[edge_runtime]
enabled = false
